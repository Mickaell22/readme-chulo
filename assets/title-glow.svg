<!--
  PLANTILLA titulo animado ESTILO GLOW (neon que respira): una copia difuminada
  del wordmark late detras del texto nitido. Sin desplazamientos: elegante y quieto.
  Ideal para: apps con dark theme, productos "premium", juegos, media.

  Como adaptar:
  1) Cambiar el texto en AMBOS <text> (deben ser identicos).
  2) Centrar: x = (820 - N*0.6*font_size) / 2 con fuente mono, o dejar
     text-anchor="middle" x="410" como aqui (recomendado).
  3) Color del glow = acento del proyecto; el texto nitido en un tono claro.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="130" viewBox="0 0 820 130" fill="none" role="img" aria-label="NOMBRE DEL PROYECTO">
  <defs>
    <filter id="blur" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- capa glow: late -->
  <text x="410" y="82" text-anchor="middle" font-family="'DejaVu Sans Mono','JetBrains Mono','Consolas',monospace" font-size="52" font-weight="bold" fill="#6C5CE7" filter="url(#blur)" opacity="0.5">NOMBRE PROYECTO
    <animate attributeName="opacity" values="0.35;0.9;0.35" dur="2.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" keyTimes="0;0.5;1"/>
  </text>

  <!-- capa nitida -->
  <text x="410" y="82" text-anchor="middle" font-family="'DejaVu Sans Mono','JetBrains Mono','Consolas',monospace" font-size="52" font-weight="bold" fill="#e8e6ff">NOMBRE PROYECTO</text>
</svg>
