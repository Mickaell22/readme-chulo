<!--
  PLANTILLA titulo animado ESTILO UNDERLINE-DRAW: el nombre aparece con fade
  y una linea de acento se dibuja debajo de izquierda a derecha, luego un punto
  final "aterriza". Sobrio y editorial.
  Ideal para: librerias, backends, docs, proyectos serios.

  Como adaptar:
  1) Cambiar el texto (text-anchor="middle" centrado en x=410).
  2) Ajustar x1/x2 de la linea al ancho del wordmark (~N*0.6*font_size,
     centrado alrededor de 410). La dasharray/dashoffset = longitud de la linea.
  3) Colores: linea y punto con el acento del proyecto.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="130" viewBox="0 0 820 130" fill="none" role="img" aria-label="NOMBRE DEL PROYECTO">
  <text x="410" y="74" text-anchor="middle" font-family="'DejaVu Sans Mono','JetBrains Mono','Consolas',monospace" font-size="52" font-weight="bold" fill="#efedff" opacity="0">NOMBRE PROYECTO
    <animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </text>

  <!-- subrayado que se dibuja -->
  <line x1="176" y1="98" x2="644" y2="98" stroke="#6C5CE7" stroke-width="6" stroke-linecap="round" stroke-dasharray="468" stroke-dashoffset="468">
    <animate attributeName="stroke-dashoffset" from="468" to="0" begin="0.5s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
  </line>

  <!-- punto final que aterriza -->
  <circle cx="668" cy="98" r="0" fill="#3fdd78">
    <!-- keySplines siempre con y<=1: con el overshoot (1.56) Chromium descarta
         la animacion entera y el punto nunca aparece. -->
    <animate attributeName="r" values="0;11;8" begin="1.6s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.34 1 0.64 1;0.4 0 0.2 1" keyTimes="0;0.7;1"/>
  </circle>
</svg>
