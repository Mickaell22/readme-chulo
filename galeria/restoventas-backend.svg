<!--
  Wordmark animado del backend (estilo UNDERLINE-DRAW: fade + subrayado que se
  dibuja + punto que aterriza). Sobrio, para un repo de API.
  "RestoVentas API" = 15 caracteres a 52px mono ~ 468px de ancho, que es justo
  el largo del subrayado (x1=176 -> x2=644) y su dasharray.
  El wordmark va en zinc-500 (#71717a): legible sobre el fondo blanco y sobre el
  #0d1117 del tema oscuro de GitHub, a diferencia de un tono claro fijo.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="130" viewBox="0 0 820 130" fill="none" role="img" aria-label="RestoVentas API">
  <text x="410" y="74" text-anchor="middle" font-family="'DejaVu Sans Mono','JetBrains Mono','Consolas',monospace" font-size="52" font-weight="bold" fill="#71717a" opacity="0">RestoVentas<tspan fill="#ea580c"> API</tspan>
    <animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </text>

  <!-- subrayado que se dibuja -->
  <line x1="176" y1="98" x2="644" y2="98" stroke="#ea580c" stroke-width="6" stroke-linecap="round" stroke-dasharray="468" stroke-dashoffset="468">
    <animate attributeName="stroke-dashoffset" from="468" to="0" begin="0.5s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
  </line>

  <!-- punto final que aterriza -->
  <circle cx="668" cy="98" r="0" fill="#16a34a">
    <animate attributeName="r" values="0;11;8" begin="1.6s" dur="0.45s" fill="freeze" calcMode="spline" keySplines="0.34 1.56 0.64 1; 0.4 0 0.2 1" keyTimes="0;0.7;1"/>
  </circle>
</svg>
